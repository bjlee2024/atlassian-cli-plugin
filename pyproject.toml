[project]
name = "atlassian-cli"
version = "0.2.0"
description = "Atlassian CLI plugin for Claude Code - Confluence & Jira operations via Python SDK"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "atlassian-python-api>=3.41.0",
]

[project.scripts]
atlassian-cli = "atlassian_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlassian_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
